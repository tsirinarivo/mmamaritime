<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMA — Madagascar Maritime Agency | Bientôt en ligne</title>
<meta name="description" content="Madagascar Maritime Agency — Ship agency, Manning & Logistique portuaire à Madagascar.">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:  #0A2A43;
  --gold:  #C9A24B;
  --teal:  #1CA5A5;
  --white: #FFFFFF;
  --muted: rgba(255,255,255,0.52);
}

html, body {
  width: 100%; height: 100%;
  background: var(--navy);
  color: var(--white);
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  overflow-x: hidden;
}

/* ── CANVAS BG ─── */
#bg {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── AURORA ─── */
.aurora {
  position: fixed; inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.ab {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
}
.ab1 {
  width: 650px; height: 420px;
  background: radial-gradient(circle, rgba(28,165,165,0.22), transparent 70%);
  top: -120px; left: -80px;
  animation: ab1 20s ease-in-out infinite;
}
.ab2 {
  width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(201,162,75,0.1), transparent 70%);
  top: 25%; right: -140px;
  animation: ab2 25s ease-in-out infinite;
}
.ab3 {
  width: 720px; height: 320px;
  background: radial-gradient(circle, rgba(13,53,87,0.9), transparent 70%);
  bottom: -40px; left: 15%;
  animation: ab3 17s ease-in-out infinite;
}
@keyframes ab1 {
  0%,100% { transform: translate(0,0) scale(1); }
  40%      { transform: translate(100px,70px) scale(1.12); }
  70%      { transform: translate(-30px,100px) scale(0.94); }
}
@keyframes ab2 {
  0%,100% { transform: translate(0,0) scale(1); }
  55%      { transform: translate(-90px,-55px) scale(1.18); }
}
@keyframes ab3 {
  0%,100% { transform: translate(0,0) scale(1); }
  45%      { transform: translate(50px,-35px) scale(1.06); }
}

/* ── TOP BAR ─── */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%, var(--teal) 20%, var(--gold) 50%, var(--teal) 80%, transparent 100%);
  background-size: 200% 100%;
  animation: bar 4s linear infinite;
  z-index: 200;
}
@keyframes bar {
  0%   { background-position: 120% 0; }
  100% { background-position: -80% 0; }
}

/* ── COORDS ─── */
.coords {
  position: fixed; bottom: 1.6rem; left: 1.8rem;
  font-family: 'Courier New', monospace;
  font-size: 0.64rem; letter-spacing: 0.14em;
  color: rgba(201,162,75,0.38);
  z-index: 50;
  animation: fadel 1s 2.4s ease both;
  opacity: 0;
}
@keyframes fadel {
  from { opacity:0; transform: translateX(-12px); }
  to   { opacity:1; transform: translateX(0); }
}

/* ── LANG ─── */
.lang {
  position: fixed; top: 1.4rem; right: 1.8rem;
  display: flex; gap: .2rem; z-index: 200;
}
.lang button {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.35);
  font-size: .68rem; font-weight: 700; letter-spacing: .1em;
  padding: .28rem .62rem; border-radius: 2px;
  cursor: pointer; transition: all .22s;
}
.lang button.on {
  background: var(--gold); border-color: var(--gold); color: var(--navy);
}

/* ── STAGE ─── */
.stage {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 6rem 2rem 10rem;
  text-align: center;
}
.parallax { will-change: transform; }

/* ── RADAR ─── */
.radar-wrap {
  width: 140px; height: 140px;
  margin-bottom: 2.2rem;
  animation: rup .9s .05s ease both;
  opacity: 0;
}
#rcv { display: block; }

/* ── BRAND ─── */
.brand-name {
  font-size: clamp(2.8rem, 7vw, 4.5rem);
  font-weight: 800;
  letter-spacing: .22em;
  line-height: 1;
  margin-bottom: .4rem;
  background: linear-gradient(120deg, #fff 20%, #C9A24B 52%, #fff 78%);
  background-size: 220% auto;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 4.5s 1.2s linear infinite, rup .9s .25s ease both;
  opacity: 0;
  position: relative;
}
/* Glitch layers */
.brand-name::before,
.brand-name::after {
  content: 'MMA';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  font-size: inherit; font-weight: inherit;
  letter-spacing: inherit; line-height: inherit;
  text-align: center;
  opacity: 0;
}
.brand-name::before {
  -webkit-text-fill-color: #1CA5A5;
  background: none; -webkit-background-clip: unset; background-clip: unset;
  animation: ga 9s 4s step-end infinite;
}
.brand-name::after {
  -webkit-text-fill-color: #e8c060;
  background: none; -webkit-background-clip: unset; background-clip: unset;
  animation: gb 9s 4s step-end infinite;
}
@keyframes ga {
  0%,88%,93%,100% { opacity:0; transform:translate(0); clip-path:none; }
  89% { opacity:.75; transform:translate(-3px,1px); clip-path:polygon(0 15%,100% 15%,100% 38%,0 38%); }
  90% { opacity:0; }
  91% { opacity:.5; transform:translate(2px,-1px); clip-path:polygon(0 55%,100% 55%,100% 68%,0 68%); }
  92% { opacity:0; }
}
@keyframes gb {
  0%,88%,93%,100% { opacity:0; transform:translate(0); clip-path:none; }
  89% { opacity:0; }
  90% { opacity:.6; transform:translate(3px,-2px); clip-path:polygon(0 45%,100% 45%,100% 62%,0 62%); }
  92% { opacity:.4; transform:translate(-2px,1px); clip-path:polygon(0 20%,100% 20%,100% 32%,0 32%); }
}
@keyframes shimmer {
  0%   { background-position: -60% center; }
  100% { background-position: 220% center; }
}

.brand-sub {
  font-size: .58rem; font-weight: 600; letter-spacing: .38em;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 1.9rem;
  animation: rup .9s .42s ease both; opacity: 0;
}

/* ── DIVIDER ─── */
.gold-line {
  width: 56px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 2rem;
  animation: lx .9s .58s ease both; opacity: 0;
}
@keyframes lx {
  from { opacity:0; transform:scaleX(0); }
  to   { opacity:1; transform:scaleX(1); }
}

/* ── TITLE ─── */
h1.title {
  font-size: clamp(1.65rem, 3.8vw, 2.5rem);
  font-weight: 700; letter-spacing: -.02em; line-height: 1.2;
  margin-bottom: 1.3rem; perspective: 800px;
}
.char {
  display: inline-block;
  animation: cu .55s ease both; opacity: 0;
}
.char-gold { color: var(--gold); }
.char-space { min-width: .28em; }
@keyframes cu {
  from { opacity:0; transform: translateY(32px) rotateX(-45deg); }
  to   { opacity:1; transform: translateY(0) rotateX(0); }
}

/* ── DESC ─── */
.desc {
  max-width: 490px; font-size: .965rem; line-height: 1.78;
  color: var(--muted); margin-bottom: 2rem;
  animation: rup .9s 1.8s ease both; opacity: 0;
}

/* ── BADGE ─── */
.badge {
  display: inline-flex; align-items: center; gap: .65rem;
  border: 1px solid rgba(201,162,75,0.22);
  background: rgba(201,162,75,0.05);
  color: var(--gold); font-size: .76rem; font-weight: 600; letter-spacing: .07em;
  padding: .52rem 1.2rem; border-radius: 100px;
  margin-bottom: 2.5rem;
  animation: rup .9s 2s ease both, breathe 3.5s 3s ease-in-out infinite;
  opacity: 0;
}
.badge-dot {
  width: 7px; height: 7px;
  background: var(--gold); border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.2; transform:scale(.6); }
}
@keyframes breathe {
  0%,100% { box-shadow: 0 0 0 0 rgba(201,162,75,0); }
  50%      { box-shadow: 0 0 24px 6px rgba(201,162,75,0.1); }
}

/* ── EMAIL ─── */
.email {
  display: inline-flex; align-items: center; gap: .5rem;
  color: rgba(255,255,255,0.52); font-size: .88rem;
  text-decoration: none; letter-spacing: .02em;
  transition: color .25s;
  animation: rup .9s 2.2s ease both; opacity: 0;
  position: relative;
}
.email::after {
  content: '';
  position: absolute; bottom: -2px; left: 20px; right: 0;
  height: 1px; background: var(--gold);
  transform: scaleX(0); transform-origin: left;
  transition: transform .35s ease;
}
.email:hover { color: var(--gold); }
.email:hover::after { transform: scaleX(1); }
.email svg { width: 15px; height: 15px; fill: var(--gold); opacity: .6; flex-shrink: 0; }

/* ── GENERIC ─── */
@keyframes rup {
  from { opacity:0; transform: translateY(24px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ── WAVES ─── */
.waves {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 140px; overflow: hidden;
  z-index: 5; pointer-events: none;
}
.w { position: absolute; bottom: 0; width: 200%; height: 100%; }
.w:nth-child(1) path { animation: wv 10s linear infinite; }
.w:nth-child(2) path { animation: wv 15s linear infinite reverse; }
.w:nth-child(3) path { animation: wv 20s linear infinite; }
@keyframes wv {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ── REDUCED MOTION ─── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    opacity: 1 !important;
    transform: none !important;
  }
}

@media (max-width: 480px) {
  .radar-wrap { width: 108px; height: 108px; }
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

</div>

      </svg>

</main>

<div class="waves" aria-hidden="true">
  <svg class="w" viewBox="0 0 1440 140" preserveAspectRatio="none">
    <path d="M0,70 C240,115 480,25 720,70 C960,115 1200,25 1440,70 L1440,140 L0,140 Z" fill="rgba(10,42,67,0.96)"/>
    <path d="M720,70 C960,115 1200,25 1440,70 L1440,140 L720,140 Z" fill="rgba(10,42,67,0.96)"/>
  </svg>
  <svg class="w" viewBox="0 0 1440 140" preserveAspectRatio="none">
    <path d="M0,50 C200,90 400,10 600,50 C800,90 1000,10 1200,50 C1320,70 1400,35 1440,50 L1440,140 L0,140 Z" fill="rgba(28,165,165,0.07)"/>
    <path d="M720,50 C920,90 1120,10 1320,50 C1380,65 1420,40 1440,50 L1440,140 L720,140 Z" fill="rgba(28,165,165,0.07)"/>
  </svg>
  <svg class="w" viewBox="0 0 1440 140" preserveAspectRatio="none">
    <path d="M0,90 C280,120 560,50 840,90 C1120,130 1300,55 1440,90 L1440,140 L0,140 Z" fill="rgba(201,162,75,0.04)"/>
    <path d="M720,90 C1000,120 1200,55 1440,90 L1440,140 L720,140 Z" fill="rgba(201,162,75,0.04)"/>

</div>

<script>
/* ── PARTICLE + CONSTELLATION ── */
(function(){
  var cv = document.getElementById('bg');
  var cx = cv.getContext('2d');
  var N = 80, pts = [];
  var MAX_DIST = 130;

  function resize(){ cv.width = innerWidth; cv.height = innerHeight; }

  function P(boot){
    this.reset = function(b){
      this.x  = Math.random() * cv.width;
      this.y  = b ? Math.random() * cv.height : cv.height + 15;
      this.r  = Math.random() * 1.8 + .4;
      this.vy = -(Math.random() * .55 + .15);
      this.vx = (Math.random() - .5) * .18;
      this.a  = Math.random() * .45 + .06;
      this.ph = Math.random() * Math.PI * 2;
      this.sp = Math.random() * .018 + .006;
      var t = Math.random();
      this.rgb = t < .4 ? '201,162,75' : t < .68 ? '28,165,165' : '255,255,255';
    };
    this.reset(boot);
    this.tick = function(){
      this.ph += this.sp;
      this.x  += this.vx + Math.sin(this.ph) * .28;
      this.y  += this.vy;
      if(this.y < -8) this.reset(false);
    };
    this.draw = function(){
      cx.beginPath();
      cx.arc(this.x, this.y, this.r, 0, 6.283);
      cx.fillStyle = 'rgba('+this.rgb+','+this.a+')';
      cx.fill();
    };
  }

  resize();
  for(var i=0;i<N;i++) pts.push(new P(true));

  (function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    /* constellation lines */
    cx.lineWidth = 0.5;
    for(var i=0;i<pts.length;i++){
      for(var j=i+1;j<pts.length;j++){
        var dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
        var d=Math.sqrt(dx*dx+dy*dy);
        if(d<MAX_DIST){
          cx.beginPath();
          cx.moveTo(pts[i].x,pts[i].y);
          cx.lineTo(pts[j].x,pts[j].y);
          cx.strokeStyle='rgba(201,162,75,'+(0.13*(1-d/MAX_DIST))+')';
          cx.stroke();
        }
      }
    }
    pts.forEach(function(p){ p.tick(); p.draw(); });
    requestAnimationFrame(loop);
  })();

  window.addEventListener('resize', resize, {passive:true});
})();

/* ── RADAR CANVAS ── */
(function(){
  var cv = document.getElementById('rcv');
  var cx = cv.getContext('2d');
  var W=140, H=140, CX=70, CY=70, R=66;
  var angle = 0;
  var TWO_PI = Math.PI*2;
  var SPEED  = TWO_PI / (3.8 * 60);
  var blips  = [];

  function loop(){
    angle = (angle + SPEED) % TWO_PI;

    /* spawn blip near current sweep angle */
    if(Math.random() < 0.028){
      var ba = angle + (Math.random()-.5)*.15;
      var bd = Math.random()*.78+.14;
      blips.push({ a:ba, d:bd, life:1.0 });
    }

    /* decay blips */
    for(var i=blips.length-1;i>=0;i--){
      blips[i].life -= 0.0055;
      if(blips[i].life<=0) blips.splice(i,1);
    }

    draw();
    requestAnimationFrame(loop);
  }

  function draw(){
    cx.clearRect(0,0,W,H);

    /* clip to circle */
    cx.save();
    cx.beginPath(); cx.arc(CX,CY,R,0,TWO_PI); cx.clip();

    /* sweep */
    if(cx.createConicGradient){
      var sg = cx.createConicGradient(angle - Math.PI/2, CX, CY);
      sg.addColorStop(0,    'rgba(28,165,165,0.32)');
      sg.addColorStop(0.07, 'rgba(28,165,165,0.10)');
      sg.addColorStop(0.13, 'rgba(28,165,165,0.02)');
      sg.addColorStop(0.14, 'rgba(28,165,165,0)');
      sg.addColorStop(1,    'rgba(28,165,165,0)');
      cx.fillStyle = sg;
      cx.beginPath(); cx.arc(CX,CY,R,0,TWO_PI); cx.fill();
    } else {
      /* fallback: wedge */
      cx.beginPath(); cx.moveTo(CX,CY);
      cx.arc(CX,CY,R, angle-.85, angle); cx.closePath();
      cx.fillStyle='rgba(28,165,165,0.16)'; cx.fill();
    }

    cx.restore();

    /* crosshair */
    cx.save();
    cx.strokeStyle='rgba(201,162,75,0.07)'; cx.lineWidth=.8;
    cx.beginPath(); cx.moveTo(CX-R,CY); cx.lineTo(CX+R,CY); cx.stroke();
    cx.beginPath(); cx.moveTo(CX,CY-R); cx.lineTo(CX,CY+R); cx.stroke();
    cx.restore();

    /* rings */
    var rings=[{f:1,c:'rgba(201,162,75,0.28)',lw:1.5,ld:[]},
               {f:.65,c:'rgba(28,165,165,0.22)',lw:.9,ld:[3,4]},
               {f:.38,c:'rgba(201,162,75,0.13)',lw:.8,ld:[]}];
    rings.forEach(function(rg){
      cx.beginPath(); cx.arc(CX,CY,R*rg.f,0,TWO_PI);
      cx.strokeStyle=rg.c; cx.lineWidth=rg.lw;
      cx.setLineDash(rg.ld); cx.stroke(); cx.setLineDash([]);
    });

    /* tick marks on outer ring */
    for(var t=0;t<12;t++){
      var ta = (t/12)*TWO_PI;
      var tm = t%3===0 ? 5 : 3;
      cx.beginPath();
      cx.moveTo(CX+Math.cos(ta)*(R-tm), CY+Math.sin(ta)*(R-tm));
      cx.lineTo(CX+Math.cos(ta)*R,      CY+Math.sin(ta)*R);
      cx.strokeStyle = t%3===0 ? 'rgba(201,162,75,0.55)' : 'rgba(201,162,75,0.2)';
      cx.lineWidth   = t%3===0 ? 1.4 : .7;
      cx.stroke();
    }

    /* blips */
    blips.forEach(function(b){
      var bx = CX + Math.cos(b.a)*R*b.d;
      var by = CY + Math.sin(b.a)*R*b.d;
      var sz = 2.8*b.life + .5;
      /* halo */
      cx.beginPath(); cx.arc(bx,by,sz*3,0,TWO_PI);
      cx.fillStyle='rgba(28,165,165,'+(b.life*.14)+')'; cx.fill();
      /* core */
      cx.beginPath(); cx.arc(bx,by,sz,0,TWO_PI);
      cx.fillStyle='rgba(28,165,165,'+(b.life*.9)+')'; cx.fill();
    });

    /* sweep tip bright dot */
    var tx=CX+Math.cos(angle)*R*.9, ty=CY+Math.sin(angle)*R*.9;
    cx.beginPath(); cx.arc(tx,ty,2,0,TWO_PI);
    cx.fillStyle='rgba(28,165,165,.95)'; cx.fill();

    /* center glow */
    cx.beginPath(); cx.arc(CX,CY,10,0,TWO_PI);
    cx.fillStyle='rgba(201,162,75,0.1)'; cx.fill();
    cx.beginPath(); cx.arc(CX,CY,3.5,0,TWO_PI);
    cx.fillStyle='rgba(201,162,75,0.92)'; cx.fill();

    /* anchor (canvas text emoji — native rendering) */
    cx.save();
    cx.font='20px serif';
    cx.fillStyle='rgba(201,162,75,0.28)';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('⚓',CX,CY);
    cx.restore();
  }

  loop();
})();

/* ── MOUSE PARALLAX ── */
(function(){
  var el = document.getElementById('px');
  var tx=0, ty=0, cx=0, cy=0;
  window.addEventListener('mousemove', function(e){
    tx = (e.clientX/innerWidth  - .5) * 2;
    ty = (e.clientY/innerHeight - .5) * 2;
  },{passive:true});
  (function frame(){
    cx += (tx-cx)*.042;
    cy += (ty-cy)*.042;
    el.style.transform='translate('+(cx*9)+'px,'+(cy*5)+'px)';
    requestAnimationFrame(frame);
  })();
})();

/* ── TRANSLATIONS ── */
var TR = {
  fr: {
    segs: [{t:'Notre site arrive ',g:false},{t:'bientôt',g:true}],
    desc: "Madagascar Maritime Agency, votre partenaire de confiance pour la consignation de navires, le manning et la logistique portuaire à Madagascar. Notre site sera disponible très prochainement.",
    badge: "Lancement imminent"
  },
  en: {
    segs: [{t:'Our website is ',g:false},{t:'coming soon',g:true}],
    desc: "Madagascar Maritime Agency, your trusted partner for ship agency, manning, and port logistics in Madagascar. Our website will be available very soon.",
    badge: "Launching soon"
  }
};

/* ── CHAR SPLIT ── */
function buildTitle(segs){
  var el=document.getElementById('ttl');
  el.innerHTML='';
  var d=.75;
  segs.forEach(function(seg){
    Array.from(seg.t).forEach(function(ch){
      var s=document.createElement('span');
      var cls='char';
      if(seg.g) cls+=' char-gold';
      if(ch===' ') cls+=' char-space';
      s.className=cls;
      s.textContent=ch===' '?' ':ch;
      s.style.animationDelay=d.toFixed(3)+'s';
      el.appendChild(s);
      d+=ch===' '?.044:.038;
    });
  });
}

function setLang(lang){
  var data=TR[lang];
  buildTitle(data.segs);
  document.getElementById('dsc').textContent=data.desc;
  document.getElementById('bdg').textContent=data.badge;
  document.documentElement.lang=lang;
  document.querySelectorAll('.lang button').forEach(function(b){
    var on=b.textContent.toLowerCase()===lang;
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on);
  });
}

setLang('fr');
</script>
