<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMA — Madagascar Maritime Agency | Bientôt en ligne</title>
<meta name="description" content="Madagascar Maritime Agency — Ship agency, Manning & Logistique portuaire à Madagascar.">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:    #0A2A43;
  --navy-2:  #0D3557;
  --gold:    #C9A24B;
  --gold-d:  rgba(201,162,75,0.22);
  --teal:    #1CA5A5;
  --teal-d:  rgba(28,165,165,0.15);
  --white:   #FFFFFF;
  --muted:   rgba(255,255,255,0.52);
}

html, body {
  width: 100%; height: 100%;
  background: var(--navy);
  color: var(--white);
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  overflow-x: hidden;
}

/* ── CANVAS ───────────────────── */
#bg {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── TOP BAR ──────────────────── */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--teal) 20%,
    var(--gold) 50%,
    var(--teal) 80%,
    transparent 100%
  );
  background-size: 200% 100%;
  animation: bar-move 4s linear infinite;
  z-index: 200;
}
@keyframes bar-move {
  0%   { background-position: 120% 0; }
  100% { background-position: -80% 0; }
}

/* ── COORDINATES ──────────────── */
.coords {
  position: fixed;
  bottom: 1.6rem; left: 1.8rem;
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: rgba(201,162,75,0.4);
  z-index: 50;
  animation: fade-left 1s 2.4s ease both;
  opacity: 0;
}
@keyframes fade-left {
  from { opacity: 0; transform: translateX(-12px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ── LANG TOGGLE ──────────────── */
.lang {
  position: fixed;
  top: 1.4rem; right: 1.8rem;
  display: flex; gap: .2rem;
  z-index: 200;
}
.lang button {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.35);
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .1em;
  padding: .28rem .62rem;
  border-radius: 2px;
  cursor: pointer;
  transition: all .22s;
}
.lang button.on {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--navy);
}

/* ── STAGE ────────────────────── */
.stage {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 6rem 2rem 10rem;
  text-align: center;
}

/* ── RADAR ────────────────────── */
.radar {
  position: relative;
  width: 112px; height: 112px;
  margin-bottom: 2.25rem;
  animation: reveal-up .9s .05s ease both;
  opacity: 0;
}

.ring {
  position: absolute;
  border-radius: 50%;
}
.r-outer {
  inset: 0;
  border: 1.5px solid rgba(201,162,75,0.28);
  animation: cw 22s linear infinite;
}
.r-outer::before,
.r-outer::after {
  content: '';
  position: absolute;
  left: 50%; transform: translateX(-50%);
  width: 3px; height: 9px;
  background: var(--gold);
  border-radius: 2px;
}
.r-outer::before { top: -5px; }
.r-outer::after  { bottom: -5px; opacity: .3; }

.r-mid {
  inset: 14px;
  border: 1px dashed rgba(28,165,165,0.3);
  animation: ccw 12s linear infinite;
}
.r-inner {
  inset: 30px;
  border: 1px solid rgba(201,162,75,0.15);
  animation: cw 8s linear infinite;
}

/* Sweep */
.sweep {
  position: absolute; inset: 0;
  border-radius: 50%; overflow: hidden;
}
.sweep::after {
  content: '';
  position: absolute; inset: 0;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    rgba(28,165,165,0.28) 14deg,
    rgba(28,165,165,0.06) 38deg,
    transparent 58deg
  );
  animation: cw 3.8s linear infinite;
}

/* Center dot */
.c-dot {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 7px; height: 7px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 10px 3px rgba(201,162,75,0.45);
  animation: dot-pulse 2.5s ease-in-out infinite;
}
@keyframes dot-pulse {
  0%,100% { box-shadow: 0 0 10px 3px rgba(201,162,75,0.45); }
  50%      { box-shadow: 0 0 18px 7px rgba(201,162,75,0.15); }
}

/* Anchor */
.anchor {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 32px; height: 32px;
  fill: var(--gold);
  filter: drop-shadow(0 0 6px rgba(201,162,75,0.4));
  animation: float 3.2s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translate(-50%, calc(-50% + 0px)); }
  50%      { transform: translate(-50%, calc(-50% - 8px)); }
}

@keyframes cw  { to { transform: rotate(360deg); } }
@keyframes ccw { to { transform: rotate(-360deg); } }

/* ── BRAND ────────────────────── */
.brand-name {
  font-size: clamp(2.8rem, 7vw, 4.5rem);
  font-weight: 800;
  letter-spacing: .22em;
  line-height: 1;
  margin-bottom: .4rem;
  background: linear-gradient(120deg, #fff 20%, #C9A24B 52%, #fff 78%);
  background-size: 220% auto;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer-text 4.5s 1.2s linear infinite, reveal-up .9s .25s ease both;
  opacity: 0;
}
@keyframes shimmer-text {
  0%   { background-position: -60% center; }
  100% { background-position: 220% center; }
}

.brand-sub {
  font-size: .58rem;
  font-weight: 600;
  letter-spacing: .38em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 1.9rem;
  animation: reveal-up .9s .42s ease both;
  opacity: 0;
}

/* Gold divider */
.gold-line {
  width: 56px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 2rem;
  animation: line-expand .9s .58s ease both;
  opacity: 0;
}
@keyframes line-expand {
  from { opacity: 0; transform: scaleX(0); }
  to   { opacity: 1; transform: scaleX(1); }
}

/* ── TITLE ────────────────────── */
h1.title {
  font-size: clamp(1.65rem, 3.8vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.2;
  margin-bottom: 1.3rem;
  perspective: 800px;
}
.char {
  display: inline-block;
  animation: char-up .55s ease both;
  opacity: 0;
}
.char-gold { color: var(--gold); }
.char-space { min-width: .28em; }
@keyframes char-up {
  from { opacity: 0; transform: translateY(32px) rotateX(-45deg); }
  to   { opacity: 1; transform: translateY(0) rotateX(0); }
}

/* ── DESC ─────────────────────── */
.desc {
  max-width: 490px;
  font-size: .965rem;
  line-height: 1.78;
  color: var(--muted);
  margin-bottom: 2rem;
  animation: reveal-up .9s 1.8s ease both;
  opacity: 0;
}

/* ── BADGE ────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: .65rem;
  border: 1px solid rgba(201,162,75,0.22);
  background: rgba(201,162,75,0.05);
  color: var(--gold);
  font-size: .76rem;
  font-weight: 600;
  letter-spacing: .07em;
  padding: .52rem 1.2rem;
  border-radius: 100px;
  margin-bottom: 2.5rem;
  animation: reveal-up .9s 2s ease both, badge-breathe 3.5s 3s ease-in-out infinite;
  opacity: 0;
}
.badge-dot {
  width: 7px; height: 7px;
  background: var(--gold);
  border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .25; transform: scale(.65); }
}
@keyframes badge-breathe {
  0%,100% { box-shadow: 0 0 0 0 rgba(201,162,75,0); }
  50%      { box-shadow: 0 0 22px 5px rgba(201,162,75,0.1); }
}

/* ── EMAIL ────────────────────── */
.email {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  color: rgba(255,255,255,0.55);
  font-size: .88rem;
  text-decoration: none;
  letter-spacing: .02em;
  transition: color .25s;
  animation: reveal-up .9s 2.2s ease both;
  opacity: 0;
  position: relative;
}
.email::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 20px; right: 0;
  height: 1px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .35s ease;
}
.email:hover { color: var(--gold); }
.email:hover::after { transform: scaleX(1); }
.email svg { width: 15px; height: 15px; fill: var(--gold); opacity: .6; flex-shrink: 0; }

/* ── GENERIC REVEAL ───────────── */
@keyframes reveal-up {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── WAVES ────────────────────── */
.waves {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 140px;
  overflow: hidden;
  z-index: 5;
  pointer-events: none;
}
.w {
  position: absolute;
  bottom: 0;
  width: 200%; height: 100%;
}
.w:nth-child(1) path { animation: wave 10s linear infinite; }
.w:nth-child(2) path { animation: wave 15s linear infinite reverse; }
.w:nth-child(3) path { animation: wave 20s linear infinite; }
@keyframes wave {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ── REDUCED MOTION ───────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    opacity: 1 !important;
    transform: none !important;
  }
}

@media (max-width: 480px) {
  .radar { width: 90px; height: 90px; }
  .anchor { width: 26px; height: 26px; }
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="top-bar" aria-hidden="true"></div>
<p class="coords" aria-hidden="true">18.1496° S &nbsp;&middot;&nbsp; 49.4023° E</p>

<div class="lang" role="group" aria-label="Langue / Language">
  <button class="on" onclick="setLang('fr')" aria-pressed="true">FR</button>
  <button onclick="setLang('en')" aria-pressed="false">EN</button>
</div>

<main class="stage">

  <div class="radar" aria-hidden="true">
    <div class="ring r-outer"></div>
    <div class="ring r-mid"></div>
    <div class="ring r-inner"></div>
    <div class="sweep"></div>
    <div class="c-dot"></div>
    <svg class="anchor" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm1 8v-1.17A6 6 0 0 1 16 22a6 6 0 0 1-1-11.17V12h-3v2h2v8.93A9 9 0 0 1 7.06 17H9v-2H4v5h2a11 11 0 0 0 9 10.8V31h-3v2h6v-2h-3v-1.2A11 11 0 0 0 24 20v-5h-5v2h1.94A9 9 0 0 1 16 22.93V14h2v-2h-1z"/>
    </svg>
  </div>

  <div class="brand-name" aria-label="MMA">MMA</div>
  <div class="brand-sub">Madagascar Maritime Agency</div>

  <div class="gold-line" aria-hidden="true"></div>

  <h1 class="title" id="ttl" aria-label="Notre site arrive bientôt"></h1>

  <p class="desc" id="dsc">
    Madagascar Maritime Agency, votre partenaire de confiance pour la consignation de navires, le manning et la logistique portuaire à Madagascar. Notre site sera disponible très prochainement.
  </p>

  <div class="badge" role="status" aria-live="polite">
    <span class="badge-dot" aria-hidden="true"></span>
    <span id="bdg">Lancement imminent</span>
  </div>

  <a href="mailto:contact@mmamaritime.com" class="email">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    contact@mmamaritime.com
  </a>

</main>

<div class="waves" aria-hidden="true">
  <svg class="w" viewBox="0 0 1440 140" preserveAspectRatio="none">
    <path d="M0,70 C240,115 480,25 720,70 C960,115 1200,25 1440,70 L1440,140 L0,140 Z" fill="rgba(10,42,67,0.95)"/>
    <path d="M720,70 C960,115 1200,25 1440,70 L1440,140 L720,140 Z" fill="rgba(10,42,67,0.95)"/>
  </svg>
  <svg class="w" viewBox="0 0 1440 140" preserveAspectRatio="none">
    <path d="M0,50 C200,90 400,10 600,50 C800,90 1000,10 1200,50 C1320,70 1400,35 1440,50 L1440,140 L0,140 Z" fill="rgba(28,165,165,0.07)"/>
    <path d="M720,50 C920,90 1120,10 1320,50 C1380,65 1420,40 1440,50 L1440,140 L720,140 Z" fill="rgba(28,165,165,0.07)"/>
  </svg>
  <svg class="w" viewBox="0 0 1440 140" preserveAspectRatio="none">
    <path d="M0,90 C280,120 560,50 840,90 C1120,130 1300,55 1440,90 L1440,140 L0,140 Z" fill="rgba(201,162,75,0.04)"/>
    <path d="M720,90 C1000,120 1200,55 1440,90 L1440,140 L720,140 Z" fill="rgba(201,162,75,0.04)"/>
  </svg>
</div>

<script>
/* ── CANVAS PARTICLES ─────────────────────────── */
(function(){
  const cv = document.getElementById('bg');
  const cx = cv.getContext('2d');
  const N = 75;
  const pts = [];

  function resize(){
    cv.width  = window.innerWidth;
    cv.height = window.innerHeight;
  }

  function Particle(init){
    this.reset = function(boot){
      this.x  = Math.random() * cv.width;
      this.y  = boot ? Math.random() * cv.height : cv.height + 15;
      this.r  = Math.random() * 1.8 + .4;
      this.vy = -(Math.random() * .55 + .15);
      this.vx = (Math.random() - .5) * .18;
      this.a  = Math.random() * .3 + .05;
      this.dr = Math.random() * Math.PI * 2;
      this.ds = Math.random() * .018 + .006;
      var t = Math.random();
      this.rgb = t < .38 ? '201,162,75' : t < .65 ? '28,165,165' : '255,255,255';
    };
    this.reset(init);
    this.tick = function(){
      this.dr += this.ds;
      this.x  += this.vx + Math.sin(this.dr) * .28;
      this.y  += this.vy;
      if(this.y < -8) this.reset(false);
    };
    this.draw = function(){
      cx.beginPath();
      cx.arc(this.x, this.y, this.r, 0, 6.283);
      cx.fillStyle = 'rgba('+this.rgb+','+this.a+')';
      cx.fill();
    };
  }

  resize();
  for(var i = 0; i < N; i++) pts.push(new Particle(true));

  (function loop(){
    cx.clearRect(0, 0, cv.width, cv.height);
    pts.forEach(function(p){ p.tick(); p.draw(); });
    requestAnimationFrame(loop);
  })();

  window.addEventListener('resize', resize, {passive:true});
})();

/* ── TRANSLATIONS ─────────────────────────────── */
var TR = {
  fr: {
    segs: [
      {t:'Notre site arrive ',g:false},
      {t:'bientôt',g:true}
    ],
    desc: "Madagascar Maritime Agency, votre partenaire de confiance pour la consignation de navires, le manning et la logistique portuaire à Madagascar. Notre site sera disponible très prochainement.",
    badge: "Lancement imminent"
  },
  en: {
    segs: [
      {t:'Our website is ',g:false},
      {t:'coming soon',g:true}
    ],
    desc: "Madagascar Maritime Agency, your trusted partner for ship agency, manning, and port logistics in Madagascar. Our website will be available very soon.",
    badge: "Launching soon"
  }
};

/* ── CHARACTER SPLIT & STAGGER ────────────────── */
function buildTitle(segs){
  var el = document.getElementById('ttl');
  el.innerHTML = '';
  var d = .75;
  segs.forEach(function(seg){
    Array.from(seg.t).forEach(function(ch){
      var s = document.createElement('span');
      var cls = 'char';
      if(seg.g)  cls += ' char-gold';
      if(ch===' ') cls += ' char-space';
      s.className = cls;
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.animationDelay = d.toFixed(3) + 's';
      el.appendChild(s);
      d += ch === ' ' ? .042 : .038;
    });
  });
}

function setLang(lang){
  var data = TR[lang];
  buildTitle(data.segs);
  document.getElementById('dsc').textContent = data.desc;
  document.getElementById('bdg').textContent = data.badge;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(function(b){
    var on = b.textContent.toLowerCase() === lang;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
}

setLang('fr');
</script>
</body>
</html>
